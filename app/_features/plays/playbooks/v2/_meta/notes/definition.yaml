# Notes
# Detects note-worthy content and maintains note quality.
# - Intake: creates notes from signals with confidence scores
# - Lifecycle: archives stale notes and merges duplicates

name: Notes
slug: notes
version: 2.0.0
description: Detect, create, and maintain entity notes

section: _meta
layer: learn

triggers:
  - type: signal
    signals:
      - capture_processed
      - note_created
      - note_flagged
      - preference_detected
      - context_extracted
  - type: schedule
    cron: "0 2 * * 0"

requirements:
  categories:
    optional:
      - email
      - calendar
      - documents

output:
  type: memory_update
  approval: per_entity

value:
  kind: context_captured
  estimate: 5

policy:
  auto_apply_threshold: 80

  summary: Salt detects preferences, context, and flags from your communications and maintains note quality.

  manages:
    - record_type: entity_note
      description: Preferences, context, flags, and relationship notes attached to entities

  runs_when:
    - Email or message contains preference indicators ("I prefer", "always", "never")
    - Communication mentions relationship context ("met at", "referred by")
    - Thread contains warning flags ("concerned", "frustrated", "delayed")
    - Weekly cleanup scan (Sunday 2am)

  learns:
    - label: Preferences
      description: How someone likes to work ("morning meetings", "email over phone")
      confidence_sources: Direct statement (85%), repeated pattern (90%)
    - label: Context
      description: Relationship background ("met at conference", "referred by Sarah")
      confidence_sources: Explicit mention (80%), inferred (70%)
    - label: Flags
      description: Warning signs ("frustrated with delays", "budget concerns")
      confidence_sources: Sentiment analysis (90%), keywords (85%)
    - label: Relationships
      description: Who works with whom ("reports to", "collaborates with")
      confidence_sources: Org chart mention (85%), CC patterns (75%)

  confidence_explanation: |
    90%+ = Direct explicit statement ("I prefer morning meetings") — auto-apply
    80-89% = Strong indicator (repeated pattern, clear sentiment) — auto-apply
    70-79% = Medium indicator (context mention, inferred) — review recommended
    <70% = Weak indicator — accumulate more evidence

  review_examples:
    - "Prefers email over phone calls (mentioned 3 times)"
    - "Met at SaaS Connect 2025 conference"
    - "Frustrated with project delays — follow up needed"
    - "Reports to Sarah Chen at Acme Corp"

  procedure: |
    Notes handles two responsibilities:

    1. INTAKE — Detect and create notes from signals

       Pattern matching for note-worthy content:

       PREFERENCES:
       - "I prefer", "always", "never", "please don't", "I'd rather"
       - "morning meetings", "afternoon calls", "email over phone", "text me"

       CONTEXT:
       - "referred by", "met at", "introduced by", "worked together at"
       - "known since", "previously"

       FLAGS:
       - "concerned about", "frustrated", "unhappy", "risk"
       - "delayed", "overdue", "budget issue", "scope creep"

       RELATIONSHIPS:
       - "works with", "reports to", "collaborates with", "manages"
       - "assistant to", "partner at"

       When a pattern matches:
       - Extract the note-worthy statement (1-2 sentences)
       - Classify the note type (preference, context, flag, relationship)
       - Assign confidence based on evidence strength
       - Queue for approval (or auto-apply if ≥80%)

    2. LIFECYCLE — Maintain note quality

       Weekly scan (Sunday 2am):
       - Archive notes not updated in 180 days
       - Detect duplicate notes on same entity (same type)
       - Merge duplicates, preserving unique information
       - Use highest confidence from source notes

  signals:
    - capture_processed
    - note_created
    - note_flagged
    - preference_detected
    - context_extracted

  fields:
    - note_type
    - content
    - confidence
    - is_archived

  fill_rules:
    # Preference detection
    - id: note-preference-detected
      field: note_type
      when:
        signal: preference_detected
        op: eq
        value: true
      set:
        value: "preference"
      confidence: 85
      because: Direct preference statement detected

    # Context detection
    - id: note-context-extracted
      field: note_type
      when:
        signal: context_extracted
        op: eq
        value: true
      set:
        value: "context"
      confidence: 80
      because: Relationship context mentioned

    # Flag detection
    - id: note-flag-detected
      field: note_type
      when:
        signal: note_flagged
        op: eq
        value: true
      set:
        value: "flag"
      confidence: 90
      because: Warning indicator detected in communication

    # Stale note archival
    - id: note-stale-archive
      field: is_archived
      when:
        signal: capture_processed
        op: not_exists
        value: 180
      set:
        value: "true"
      confidence: 95
      because: Note not updated in 180+ days

# Note lifecycle rules
lifecycle:
  stale_after_days: 180
  merge_duplicates: true
  version_on_update: true
