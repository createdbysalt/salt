# Memory Hygiene
# Unified data quality playbook: duplicates, stale records, incomplete records, orphans.

name: Memory Hygiene
slug: memory-hygiene
version: 2.0.0
description: Keep Memory clean by detecting duplicates, stale records, and data quality issues.

section: _meta
layer: learn

trigger:
  type: schedule
  cron: "0 3 * * 0"

triggers:
  - type: signal
    signals:
      # Duplicate detection signals
      - person_duplicate_email
      - person_duplicate_phone
      - org_duplicate_domain
      - billing_duplicate_number
      - file_duplicate_hash
      - meeting_duplicate_time_attendees
      # Hygiene signals
      - person_no_activity_90d
      - org_no_activity_90d
      - work_stale_active
      - person_missing_email
      - person_orphan

requirements:
  categories:
    optional: []

output:
  type: memory_update
  approval: batch

value:
  kind: memory_maintained
  estimate: 20

policy:
  auto_apply_threshold: 92

  summary: Salt identifies data quality issues and suggests cleanup actions.

  runs_when:
    - Weekly scheduled scan (Sundays at 3am)
    - New records share email/phone with existing people
    - Organizations share the same domain
    - Person has no email activity for 90+ days
    - Records are missing required fields
    - Records have no connections

  learns:
    - label: Merge Candidates
      description: Pairs of records that may be duplicates
      confidence_sources: Email match (95%), phone match (90%), domain match (85%)
    - label: Archive Candidates
      description: Records with no recent activity
      confidence_sources: Days since last activity (90%+ after 90 days)
    - label: Incomplete Records
      description: Records missing required fields
      confidence_sources: Missing email (88%), missing phone (80%)
    - label: Orphan Records
      description: Records with no connections to other entities
      confidence_sources: No org link (80%), no work link (75%)

  confidence_explanation: |
    95%+ = Exact email match for duplicates, auto-merge safe
    90-94% = Strong signals (phone, domain, 120+ days stale), review recommended
    80-89% = Medium signals (missing fields, orphans), manual review required

  review_examples:
    - "John Smith (john@acme.com) may be the same as John Smith (john.smith@acme.com)"
    - "Sarah Johnson hasn't been contacted in 120 days - archive?"
    - "Contact 'J. Smith' has no email or phone - complete or delete?"
    - "Person record has no organization connection - link or review?"

  procedure: |
    Memory Hygiene scans for four categories of data quality issues:

    1. DUPLICATES
       - Query Memory for records with matching identifiers
       - Score matches: email (95%), phone (90%), domain (85%), fuzzy name (70-80%)
       - Emit merge candidates above 80% confidence

    2. STALE RECORDS
       - Find records with no activity in 90+ days
       - Score by recency: 90 days (85%), 120 days (90%), 180+ days (95%)
       - Emit archive candidates

    3. INCOMPLETE RECORDS
       - Find records missing required fields (email for people, domain for orgs)
       - Score by importance: email (88%), phone (80%), name (95%)
       - Emit fill suggestions

    4. ORPHAN RECORDS
       - Find people with no organization connection
       - Find work with no client connection
       - Emit link or review suggestions

    On approval:
    - Merge candidates → merge records, keeping richer data
    - Archive candidates → set recordStatus to archived
    - Incomplete → prompt user to fill or suggest from captures
    - Orphans → suggest linking or mark for review

  signals:
    # Duplicate detection
    - person_duplicate_email
    - person_duplicate_phone
    - org_duplicate_domain
    - billing_duplicate_number
    - file_duplicate_hash
    - meeting_duplicate_time_attendees
    # Staleness
    - person_no_activity_90d
    - org_no_activity_90d
    - work_stale_active
    # Completeness
    - person_missing_email
    # Connectivity
    - person_orphan

  fields:
    - recordStatus

  fill_rules:
    # Duplicate detection rules
    - id: duplicate-person-email
      field: recordStatus
      when:
        signal: person_duplicate_email
        op: eq
        value: true
      set:
        value: "merge_candidate"
      confidence: 95
      because: Email address matches another person record

    - id: duplicate-person-phone
      field: recordStatus
      when:
        signal: person_duplicate_phone
        op: eq
        value: true
      set:
        value: "merge_candidate"
      confidence: 90
      because: Phone number matches another person record

    - id: duplicate-org-domain
      field: recordStatus
      when:
        signal: org_duplicate_domain
        op: eq
        value: true
      set:
        value: "merge_candidate"
      confidence: 85
      because: Domain matches another organization record

    - id: duplicate-billing-number
      field: recordStatus
      when:
        signal: billing_duplicate_number
        op: eq
        value: true
      set:
        value: "merge_candidate"
      confidence: 92
      because: Invoice number matches another billing record

    - id: duplicate-file-hash
      field: recordStatus
      when:
        signal: file_duplicate_hash
        op: eq
        value: true
      set:
        value: "merge_candidate"
      confidence: 98
      because: File content hash matches another file

    - id: duplicate-meeting-overlap
      field: recordStatus
      when:
        signal: meeting_duplicate_time_attendees
        op: eq
        value: true
      set:
        value: "merge_candidate"
      confidence: 88
      because: Meeting time and attendees overlap with another meeting

    # Staleness rules
    - id: hygiene-person-stale
      field: recordStatus
      when:
        signal: person_no_activity_90d
        op: eq
        value: true
      set:
        value: "stale"
      confidence: 92
      because: Person has no email or meeting activity in 90+ days

    - id: hygiene-org-stale
      field: recordStatus
      when:
        signal: org_no_activity_90d
        op: eq
        value: true
      set:
        value: "stale"
      confidence: 90
      because: Organization has no activity in 90+ days

    - id: hygiene-work-stale
      field: recordStatus
      when:
        signal: work_stale_active
        op: eq
        value: true
      set:
        value: "stale"
      confidence: 85
      because: Work is marked active but has no updates in 60+ days

    # Completeness rules
    - id: hygiene-person-incomplete
      field: recordStatus
      when:
        signal: person_missing_email
        op: eq
        value: true
      set:
        value: "incomplete"
      confidence: 88
      because: Person record is missing an email address

    # Connectivity rules
    - id: hygiene-person-orphan
      field: recordStatus
      when:
        signal: person_orphan
        op: eq
        value: true
      set:
        value: "orphan"
      confidence: 80
      because: Person has no connections to other records
