# Tools used by Memory Hygiene playbook
# These are references to shared tools in @/app/_lib/memory-tools

tools:
  - name: memoryGetFacts
    module: "@/app/_lib/memory-tools"
    purpose: Get current facts and signals for an entity
    protected: false

  - name: memoryGetStaleRecords
    module: "@/app/_lib/memory-tools"
    purpose: Find records with no activity in N+ days
    protected: false
    params:
      - name: entity_type
        type: string
        required: false
        description: Filter by entity type (omit for all)
      - name: days
        type: number
        default: 90
        description: Days since last activity
      - name: limit
        type: number
        default: 100

  - name: memoryGetIncompleteRecords
    module: "@/app/_lib/memory-tools"
    purpose: Find records missing required fields
    protected: false
    params:
      - name: entity_type
        type: string
        required: false
      - name: severity_min
        type: number
        default: 50
        description: Minimum severity to include
      - name: limit
        type: number
        default: 100

  - name: memoryGetOrphanRecords
    module: "@/app/_lib/memory-tools"
    purpose: Find records not linked to any other entity
    protected: false
    params:
      - name: entity_type
        type: string
        required: false
      - name: limit
        type: number
        default: 100

  - name: memoryUpdateField
    module: "@/app/_lib/memory-tools"
    purpose: Update a Memory field with confidence-gated protection
    protected: true
    params:
      - name: entity_type
        type: string
        required: true
      - name: entity_id
        type: string
        required: true
      - name: field
        type: string
        required: true
      - name: value
        type: any
        required: true
      - name: confidence
        type: number
        required: true
      - name: because
        type: string
        required: true

  - name: memoryArchiveRecord
    module: "@/app/_lib/memory-tools"
    purpose: Archive a record (soft delete)
    protected: true
    params:
      - name: entity_type
        type: string
        required: true
      - name: entity_id
        type: string
        required: true
      - name: reason
        type: string
        default: "hygiene_stale"

  - name: memoryLinkEntities
    module: "@/app/_lib/memory-tools"
    purpose: Create a link between two entities
    protected: true
    params:
      - name: source_type
        type: string
        required: true
      - name: source_id
        type: string
        required: true
      - name: target_type
        type: string
        required: true
      - name: target_id
        type: string
        required: true
      - name: relation_type
        type: string
        required: true
