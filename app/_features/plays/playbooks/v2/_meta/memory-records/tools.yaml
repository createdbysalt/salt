# Tools used by Memory Records playbook
# These are references to shared protected tools in @/app/_lib/memory-tools

tools:
  - name: memoryUpdateField
    module: "@/app/_lib/memory-tools"
    purpose: Update a Memory field with confidence-gated protection
    protected: true

  - name: memoryGetFacts
    module: "@/app/_lib/memory-tools"
    purpose: Get current entity state and computed signals
    protected: false

  - name: memoryGetEvidence
    module: "@/app/_lib/memory-tools"
    purpose: Get pending evidence for an entity
    protected: false

  - name: memoryAccumulateEvidence
    module: "@/app/_lib/memory-tools"
    purpose: Add evidence without triggering threshold check
    protected: true
