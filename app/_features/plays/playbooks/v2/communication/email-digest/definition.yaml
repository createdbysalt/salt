# Email Digest
# Batches low-priority emails into a daily digest.
# ACT layer — creates digest notification.

name: Email Digest
slug: email-digest
version: 1.0.0
description: Batch low-priority emails into a daily digest

section: communication
layer: act
voice: brief

trigger:
  type: schedule
  cron: "0 18 * * *"

steps:
  - step: fetch
    id: pending_digests
    from: capture.batch_digest_emails
    where:
      hours: 24
      limit: 50

  # New senders held by the Memory-first policy — the user-visible payoff
  # for keeping unknown senders out of the stream.
  - step: fetch
    id: new_senders
    from: capture.held_senders
    where:
      hours: 24
      limit: 15
    optional: true

  - step: draft
    id: digest_content
    prompt: |
      Create a daily email digest with two sections.

      Section 1 — Batched mail ({{pending_digests.length}} emails the
      classifier marked low-priority). Group by category, list subject +
      sender, keep each line short:
      {{pending_digests}}

      Section 2 — New senders (people not yet in Memory who emailed in the
      last 24h). Mention count, highlight any that look like potential
      clients, and note they can be promoted to a contact record:
      {{new_senders}}

      If a section is empty, say so in one short line. Plain text, no markdown
      headers heavier than a bolded label.
    max_tokens: 500

output:
  type: briefing
  approval: none

value:
  kind: time_saved
  estimate: 5

instructions:
  system: |
    Create a daily digest of low-priority emails that were batched.
    Post the digest to HQ feed at 6pm daily.
  guidelines:
    - Query emails where triage_action = batch_digest from last 24 hours
    - Group emails by category
    - Create a readable summary with counts
    - Post to HQ feed with "View All" action
