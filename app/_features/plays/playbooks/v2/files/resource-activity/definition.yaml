# Resource Activity
# Surfaces activity from Live mode resources (GitHub PRs, Figma changes, etc.)

name: Resource Activity
slug: resource-activity
version: 1.0.0
description: Surfaces activity from connected resources

section: files
layer: act
voice: factual

trigger:
  type: signal
  signal:
    - github_pr_opened
    - github_pr_merged
    - github_pr_closed
    - github_push
    - github_issue_opened
    - github_issue_closed
    - figma_file_updated
    - gdrive_doc_updated
    - linear_issue_updated
    - resource_activity

steps:
  - step: fetch
    id: signal_data
    from: trigger.evidence

  - step: fetch
    id: resource
    from: memory.resource
    where:
      id: "{{trigger.resource_id}}"

  - step: fetch
    id: entity
    from: memory.entity
    where:
      type: "{{trigger.entity_type}}"
      id: "{{trigger.entity_id}}"

  - step: draft
    id: summary
    prompt: |
      Synthesize the resource activity into a brief update.

      Resource: {{resource.title}} ({{resource.resource_type}})
      Activity: {{signal_data.summary}}
      Linked to: {{entity.name}} ({{trigger.entity_type}})

      Key details:
      {{#if signal_data.prNumber}}PR #{{signal_data.prNumber}}: {{signal_data.prTitle}}{{/if}}
      {{#if signal_data.branch}}Branch: {{signal_data.branch}}{{/if}}
      {{#if signal_data.action}}Action: {{signal_data.action}}{{/if}}

      Write a single sentence summary suitable for an activity feed.
    max_tokens: 100

output:
  type: activity_entry
  approval: none

value:
  kind: context_maintained
  estimate: 5

instructions:
  system: |
    You are creating activity feed entries about external resource changes.
    Keep entries brief and factual. Focus on what changed.

  guidelines:
    - Lead with what happened
    - Include relevant identifiers (PR numbers, branches)
    - Mention the linked entity
    - Keep under 50 words

  avoid:
    - Speculation about impact
    - Technical jargon unless necessary
    - Redundant information
