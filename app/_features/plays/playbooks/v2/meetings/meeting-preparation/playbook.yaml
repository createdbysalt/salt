# Meeting Preparation
# Auto-prepares briefing docs 24h before client meetings by pulling
# recent communications, performance data, and relevant context.

name: Meeting Preparation
slug: meeting-preparation
version: 1.0.0
description: Auto-generates meeting briefs 24 hours before client calls

section: meetings
layer: act
voice: internal

trigger:
  type: signal
  signal: meeting_tomorrow

requirements:
  categories:
    required:
      - google_calendar
      - gmail
  capabilities:
    required:
      - read_calendar
      - read_emails
      - read_analytics
      - read_documents

steps:
  - step: fetch
    id: upcoming_meeting
    from: calendar.events
    where:
      starts_within_hours: 24
      has_client: true

  - step: gather
    id: context
    forEach: upcoming_meeting
    from:
      - gmail.recent_threads(limit: 5)
      - drive.recent_docs(limit: 3)
      - analytics.current_performance

  - step: analyze
    id: talking_points
    prompt: |
      Review context for {{meeting.title}} with {{client.name}}.

      Recent emails: {{context.email_summaries}}
      Performance: {{context.analytics}}

      Generate 5 talking points prioritized by importance.

  - step: draft
    id: briefing_doc
    prompt: |
      Create a 2-page meeting brief for {{meeting.title}}.

      Include:
      - Meeting objective
      - Key talking points
      - Recent context summary
      - Open items from last meeting
      - Suggested next steps

    max_tokens: 800

  - step: send
    id: deliver_brief
    to: operator.inbox
    subject: "Brief: {{meeting.title}} tomorrow"

output:
  type: briefing_document
  approval: never

stakes: low
