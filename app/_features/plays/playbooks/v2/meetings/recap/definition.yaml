# Meeting Recap
# Generates post-meeting summary with action items.

name: Meeting Recap
slug: meeting-recap
version: 1.0.0
description: Generates post-meeting summary with action items

section: meetings
layer: act
voice: brief

trigger:
  type: signal
  signal: meeting_end_passed

requirements:
  categories:
    required:
      - calendar
    optional:
      - meetings

steps:
  - step: fetch
    id: meeting_details
    from: calendar.read_events
    where:
      just_ended: true

  - step: fetch
    id: meeting_notes
    from: meetings.read_notes
    optional: true

  - step: draft
    id: recap
    prompt: |
      Create a meeting recap for: {{meeting_details.title}}

      Attendees: {{meeting_details.attendees}}
      Notes: {{meeting_notes.content}}

      Structure:
      1. Key decisions made
      2. Action items (with owners if known)
      3. Follow-up needed

      Be concise. Use bullet points.
    max_tokens: 400

output:
  type: notification
  approval: none

value:
  kind: meeting_documented
  estimate: 10

instructions:
  system: |
    You are creating meeting recaps for a solopreneur.
    Focus on decisions and action items.
    Be structured and scannable.

  guidelines:
    - Lead with decisions made
    - List action items with clear owners
    - Note any follow-up needed
    - Keep under 150 words

  avoid:
    - Restating what was discussed without decisions
    - Vague action items ("follow up on things")
    - Missing owners for action items
