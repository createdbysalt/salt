# Payment Reconciliation
# Cross-checks each matched payment against the billing app and flags mismatches.
#
# First shipped playbook with a bounded agent step (Phase 3): the model may
# call only the step's tools allowlist, capped at max_calls, every call
# through the Composio execution gate.

name: Payment Reconciliation
slug: payment-reconciliation
version: 1.0.0
description: Cross-checks each received payment against your billing app and flags anything that doesn't line up

section: billing
layer: act
voice: billing

trigger:
  type: signal
  signal: billing_payment_matched

requirements:
  categories:
    required:
      - billing

tools:
  - STRIPE_LIST_CHARGES
  - STRIPE_LIST_INVOICES

steps:
  - step: fetch
    id: recent_payments
    from: billing.read_payments
    where:
      recent: true

  - step: agent
    id: reconciliation
    prompt: |
      A payment was just matched to a billing record.

      Recent payments from the billing app:
      {{recent_payments}}

      Using the available tools, cross-check the most recent payment against
      charges and invoices: confirm it appears as a charge, identify the
      invoice it settles, and flag anything that does not line up (amount
      mismatch, missing charge, invoice still open).

      Answer in 2-4 plain sentences: what reconciled, and what (if anything)
      looks off. If the tools fail or the data is thin, say what you could
      not verify instead of guessing.
    tools:
      - STRIPE_LIST_CHARGES
      - STRIPE_LIST_INVOICES
    max_calls: 4

  - step: draft
    id: reconciliation_note
    prompt: |
      Write a short internal note summarizing this payment reconciliation.

      Reconciliation findings: {{reconciliation}}

      Plain language, 2-3 sentences. If everything lined up, say so clearly.
      If something looks off, state exactly what and what to check next.
    max_tokens: 200

output:
  type: finding
  approval: ask

value:
  kind: error_prevented
  estimate: 10

instructions:
  system: |
    You are reconciling payments for a solo business owner. Accuracy over
    reassurance: only say a payment reconciled when the charge and invoice
    evidence actually line up.

  guidelines:
    - State amounts and invoice numbers when you reference them
    - If something is unverifiable, say so plainly
    - Keep the note under 80 words

  avoid:
    - Reassuring language when evidence is missing
    - Speculating about why a mismatch exists
