# Near-miss negative: the billing app already reminded — the play must
# produce nothing (quiet skip), not a duplicate nudge.
id: skip-already-reminded
name: Stripe already reminded → quiet skip, no draft
given:
  memory:
    billing_record_context:
      invoice:
        number: INV-097
        amount_cents: 80000
        amount_paid_cents: 0
        days_overdue: 6
        due_at: "2026-08-23T00:00:00Z"
      client:
        name: Bob
        email: bob@studio.com
      payment_history:
        on_time: 1
        late: 2
      open_invoices:
        - number: INV-097
          amount_remaining_cents: 80000
          days_overdue: 6
  agent:
    - step: verify_unpaid
      text: "VERDICT: SKIP — Stripe sent an automatic reminder 2 days ago"
expect:
  status: success
  outputCount: 0
  steps:
    invoice_context: success
    verify_unpaid: success
