# Contract Renewal Alert
# Detects contract end dates from email attachments and billing records,
# cross-references client performance, and drafts renewal proposals.

name: Contract Renewal Alert
slug: contract-renewal-alert
version: 1.0.0
description: Surfaces contract renewals 30 days out with drafted proposals

section: billing
layer: act
voice: billing

trigger:
  type: signal
  signal: contract_expiring_soon

requirements:
  categories:
    required:
      - billing
      - gmail
  capabilities:
    required:
      - read_contracts
      - read_billing_records
      - read_emails

steps:
  - step: fetch
    id: expiring_contracts
    from: billing.read_contracts
    where:
      expires_within_days: 30

  - step: enrich
    id: client_metrics
    forEach: expiring_contracts
    from:
      - billing.ytd_revenue
      - relationships.satisfaction_score
      - work.engagement_growth

  - step: classify
    id: renewal_strategy
    rules:
      - if: "satisfaction_score >= 90 AND engagement_growth > 100"
        then: increase_15_percent
      - if: "satisfaction_score >= 80"
        then: maintain_rate
    else: offer_discount

  - step: draft
    id: renewal_proposal
    prompt: |
      Draft a contract renewal proposal for {{client.name}}.

      Current contract: {{contract.annual_value}}
      YTD Revenue: {{ytd_revenue}}
      Satisfaction: {{satisfaction_score}}%
      Engagement growth: {{engagement_growth}}%

      Strategy: {{renewal_strategy}}

      Include 2-3 highlights from the partnership.
      Propose the new rate with justification.
    max_tokens: 400

output:
  type: email_draft
  approval: always

stakes: high
value:
  basis: contract_value
