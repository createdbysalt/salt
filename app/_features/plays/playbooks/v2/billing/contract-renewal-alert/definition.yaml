# Contract Renewal Alert
# Rescued 2026-08-07: the original playbook.yaml was written against an
# imagined schema (enrich step, unregistered signal, approval "always") and
# never loaded. Rewritten against schema v2 with executor-implemented steps.
# Weekly scan of recurring billing for engagements approaching renewal,
# drafting a renewal check-in before the contract lapses.

name: Contract Renewal Alert
slug: contract-renewal-alert
version: 1.1.0
description: Surfaces recurring engagements approaching renewal with a drafted proposal

section: billing
layer: act
voice: billing

trigger:
  type: schedule
  cron: "0 9 * * 1"

requirements:
  categories:
    required:
      - billing
    optional:
      - email

steps:
  - step: fetch
    id: recurring_clients
    from: billing.read_invoices
    where:
      billing_type: recurring

  - step: classify
    id: renewal_strategy
    forEach: recurring_clients
    rules:
      - if: "payment_history.on_time >= 3"
        then: propose_increase
      - if: "payment_history.late >= 2"
        then: gentle_renewal
    else: maintain_rate

  - step: draft
    id: renewal_proposal
    prompt: |
      Draft a contract renewal check-in.

      Recurring clients: {{recurring_clients}}
      Strategy: {{renewal_strategy}}

      Include 2-3 highlights from the partnership so far.
      If proposing an increase, justify it with the value delivered.
      If maintaining the rate, make renewing feel effortless.
      End with a clear next step to confirm the renewal.
    max_tokens: 400

output:
  type: email_draft
  approval: per_entity

value:
  kind: contract_renewed
  estimate: 60

instructions:
  system: |
    You are drafting contract renewal check-ins for freelancers and
    solopreneurs. Renewals decided by silence are lost revenue — the goal
    is to open the conversation a month early, warmly and confidently.

  guidelines:
    - Keep emails under 200 words
    - Lead with partnership highlights, not the ask
    - Name the current arrangement plainly so nothing feels hidden
    - Propose one clear next step (a reply or a short call)

  avoid:
    - Ultimatums or expiration threats
    - Apologizing for raising rates
    - Legal jargon
