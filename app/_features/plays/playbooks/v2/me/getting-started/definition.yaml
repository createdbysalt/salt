# Getting Started
# Onboarding playbook: fires when the first connector lands, drafts replies to
# the 2–3 threads that need the operator most, and gates every send.
# ACT layer — the "plays appear within minutes of connecting" payoff.

name: Getting Started
slug: getting-started
version: 1.0.0
description: Drafts replies to the threads that need you most after your first connect

section: me
layer: act
voice: follow-up

trigger:
  type: signal
  signal: connector_connected

requirements:
  categories:
    required:
      - email

# Tool allowlist (single-document canon). Every action step's tool must be
# declared here; parse-time validation enforces it.
tools:
  - GMAIL_SEND_EMAIL

steps:
  # Step 1: Backfill — recent inbound mail the classifier already flagged as
  # needing a reply. Capped at 3: this is a first impression, not a flood.
  - step: fetch
    id: candidates
    from: capture.reply_candidates
    where:
      days: 14
      limit: 3

  # Step 2: Tag each candidate so the queue card says why it was picked.
  - step: classify
    id: triage
    forEach: candidates
    rules:
      - if: "category == 'action_required'"
        then: reply_now
      - if: "category == 'opportunities'"
        then: reengage
    else: reply_now

  # Step 3: Draft one reply per candidate (forEach) — 2–3 ready-to-send
  # replies, each interpolated as {{replies.N.draft}} below.
  - step: draft
    id: replies
    forEach: candidates
    prompt: |
      Draft a short reply to this email.

      From: {{item.sender_name}} <{{item.sender_email}}>
      Subject: {{item.subject}}
      They wrote: {{item.body_preview}}

      Keep it warm, brief, and specific to what they asked. Plain text,
      body only — no subject line, no sign-off block.
    max_tokens: 220

  # Steps 4–6: Send gates. One branch per candidate slot; each send pauses
  # for approval (approval: ask — earned autonomy can lift it later).
  - step: branch
    id: send_first
    if: "candidates.length >= 1"
    steps:
      - step: action
        id: send_1
        tool: GMAIL_SEND_EMAIL
        args:
          recipient_email: "{{candidates.0.sender_email}}"
          subject: "Re: {{candidates.0.subject}}"
          body: "{{replies.0.draft}}"
        approval: ask

  - step: branch
    id: send_second
    if: "candidates.length >= 2"
    steps:
      - step: action
        id: send_2
        tool: GMAIL_SEND_EMAIL
        args:
          recipient_email: "{{candidates.1.sender_email}}"
          subject: "Re: {{candidates.1.subject}}"
          body: "{{replies.1.draft}}"
        approval: ask

  - step: branch
    id: send_third
    if: "candidates.length >= 3"
    steps:
      - step: action
        id: send_3
        tool: GMAIL_SEND_EMAIL
        args:
          recipient_email: "{{candidates.2.sender_email}}"
          subject: "Re: {{candidates.2.subject}}"
          body: "{{replies.2.draft}}"
        approval: ask

output:
  type: notification
  approval: auto

value:
  kind: relationship_maintained
  estimate: 15

instructions:
  system: |
    You are Salt running the getting-started playbook. A new operator just
    connected their inbox and you are replying to the threads that need them
    most. This is their first impression of Salt acting on their behalf.

  guidelines:
    - Keep replies under 80 words
    - Answer the sender's actual question first
    - Match the sender's tone (formal for formal, casual for casual)
    - Offer a clear next step when one is natural

  avoid:
    - '"Just bumping this" or other low-content nudges'
    - Overpromising dates or deliverables
    - Mentioning that this is an automated or AI-drafted reply
    - Replying to newsletters, receipts, or no-reply senders
