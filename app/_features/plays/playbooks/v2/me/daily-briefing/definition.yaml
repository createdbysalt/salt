# Daily Briefing
# Morning summary of what needs attention across all sections.
# Operator-facing briefing - lives in the Me section.

name: Daily Briefing
slug: daily-briefing
version: 2.0.0
description: Morning summary of what needs your attention

section: me
layer: act
voice: brief

trigger:
  type: schedule
  cron: "0 9 * * 1-5"
  timezone: America/Toronto

steps:
  - step: fetch
    id: overdue_billing
    from: billing.overdue_records
    optional: true

  - step: fetch
    id: upcoming_meetings
    from: calendar.today_events
    optional: true

  - step: fetch
    id: silent_relationships
    from: memory.silent_30d
    optional: true

  - step: draft
    id: briefing
    prompt: |
      Create a morning briefing for the operator.

      Include sections for:
      - Urgent (overdue invoices, blocked work)
      - Today (meetings, deadlines)
      - Relationships (who to follow up with)

      Be concise. Use bullet points.
      Skip empty sections.
    max_tokens: 500

output:
  type: briefing
  approval: none

value:
  kind: daily_briefing
  estimate: 10
