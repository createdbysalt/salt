# Relationship Health
# Monitors relationship health signals and surfaces risks.

name: Relationship Health
slug: relationship-health
version: 1.0.0
description: Monitors relationship health and surfaces risks

section: relationships
layer: act
voice: brief

trigger:
  type: signal
  signal: person_no_contact_30_days

steps:
  - step: fetch
    id: at_risk_relationships
    from: memory.silent_relationships
    where:
      days_since_contact: 30

  - step: classify
    id: risk_level
    forEach: at_risk_relationships
    rules:
      - if: "relationship_type == 'client'"
        then: high_priority
      - if: "relationship_type == 'prospect'"
        then: medium_priority
    else: low_priority

  - step: draft
    id: health_alert
    prompt: |
      Create a relationship health alert.

      At-risk relationships:
      - High priority: {{risk_level.high_priority.count}}
      - Medium priority: {{risk_level.medium_priority.count}}

      List the top 3 relationships that need attention.
      For each, suggest a specific action.
    max_tokens: 250

output:
  type: finding
  approval: none

value:
  kind: relationship_protected
  estimate: 20

instructions:
  system: |
    You are creating relationship health alerts for a solopreneur.
    Focus on actionable insights. Prioritize by business impact.

  guidelines:
    - Lead with highest-priority relationships
    - Suggest specific next steps
    - Note any context that explains the silence
    - Keep it scannable

  avoid:
    - Alarmist language
    - Vague suggestions ("reach out")
    - Missing context for why it matters
