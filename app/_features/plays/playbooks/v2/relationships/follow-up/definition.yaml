# Follow-up
# Consolidates: new-contact-follow-up, quiet-lead-nudge, meeting-follow-up
# Drafts re-engagement messages for contacts that have gone quiet.

name: Follow-up
slug: follow-up
version: 1.0.0
description: Drafts re-engagement messages for quiet contacts

section: relationships
layer: act
voice: follow-up

trigger:
  type: signal
  signal: person_no_contact_30_days
  surface: person

requirements:
  categories:
    required:
      - email

steps:
  - step: fetch
    id: contact_context
    from: memory.person_context

  - step: classify
    id: relationship_type
    forEach: contact_context
    rules:
      - if: "relationship_type == 'client'"
        then: client_checkin
      - if: "relationship_type == 'prospect'"
        then: lead_nudge
      - if: "has_calendar_meeting == true"
        then: meeting_follow_up
    else: general_reconnect

  - step: draft
    id: follow_up_email
    prompt: |
      Draft a {{relationship_type}} message for {{contact_context.name}}.

      Last contact: {{contact_context.last_contact_at}}
      Context: {{contact_context.recent_notes}}

      Keep it warm and brief. Reference something specific if possible.
      Don't be pushy.
    max_tokens: 200

output:
  type: email_draft
  approval: per_entity

value:
  kind: relationship_maintained
  estimate: 15

instructions:
  system: |
    You are drafting re-engagement messages for contacts that have gone quiet.
    Be warm and genuine. Reference specific past interactions when possible.
    The goal is to reconnect, not to sell.

  guidelines:
    - Keep under 100 words
    - Reference something specific from past interactions
    - Ask an open-ended question
    - Don't mention how long it's been since contact

  avoid:
    - '"It''s been a while" or similar'
    - Pushy sales language
    - Generic "checking in" messages
    - Multiple questions

  examples:
    - label: Client check-in
      content: |
        Hi Sarah,

        Hope the website launch went well! I saw Acme's new
        homepage and the animations look great.

        How's the team settling into the new design system?

        Best,
        [Name]
      context: Use for clients with recent completed work

    - label: Prospect nudge
      content: |
        Hi Alex,

        I came across an article on API design patterns and
        thought of our conversation about the integration project.

        Worth a quick chat if you're still exploring options?

        Cheers,
        [Name]
      context: Use for prospects who went quiet after initial contact
