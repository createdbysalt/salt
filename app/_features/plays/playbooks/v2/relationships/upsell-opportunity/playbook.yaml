# Upsell Opportunity Detection
# Monitors client communications for expansion intent signals,
# analyzes competitive landscape, and builds tiered proposals.

name: Upsell Opportunity Detection
slug: upsell-opportunity
version: 1.0.0
description: Detects expansion signals and drafts tiered upsell proposals

section: relationships
layer: act
voice: sales

trigger:
  type: signal
  signal: expansion_intent_detected

requirements:
  categories:
    required:
      - gmail
      - relationships
  capabilities:
    required:
      - read_emails
      - competitive_research
      - read_billing_records

steps:
  - step: detect
    id: intent_signals
    from: gmail.read_emails
    where:
      contains_keywords:
        - "exploring"
        - "interested in"
        - "considering"
        - "looking into"

  - step: research
    id: competitive_intel
    forEach: intent_signals
    from: web.competitive_analysis
    params:
      industry: "{{client.industry}}"
      service: "{{detected_service}}"

  - step: calculate
    id: roi_projection
    formula: |
      base_roi = industry_benchmark_roi
      adjusted = base_roi * (client.engagement_score / 100)

  - step: draft
    id: tiered_proposal
    prompt: |
      Draft a 3-tier proposal for {{client.name}}.
      Service requested: {{detected_service}}

      Competitive context:
      {{competitive_intel}}

      Create tiers:
      1. Foundation (entry-level)
      2. Growth (recommended)
      3. Prestige (premium)

      Include ROI projection: {{roi_projection}}x
    max_tokens: 600

output:
  type: proposal_draft
  approval: always

stakes: high
value:
  basis: projected_annual_value
