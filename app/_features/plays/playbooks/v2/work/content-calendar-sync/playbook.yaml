# Content Calendar Sync
# Monitors shared Google Sheets for new content requests,
# syncs to internal tracker, assigns to team, and blocks review time.

name: Content Calendar Sync
slug: content-calendar-sync
version: 1.0.0
description: Syncs content requests from client sheets to internal systems

section: work
layer: act
voice: internal

trigger:
  type: signal
  signal: sheet_rows_added

requirements:
  categories:
    required:
      - google_sheets
      - google_calendar
  capabilities:
    required:
      - read_sheets
      - update_tracker
      - create_calendar_event
      - send_email

steps:
  - step: detect
    id: new_requests
    from: sheets.watch
    where:
      sheet_name_contains: "Content"
      new_rows: true

  - step: parse
    id: content_items
    forEach: new_requests
    extract:
      - title
      - due_date
      - platform
      - notes

  - step: sync
    id: tracker_update
    forEach: content_items
    to: internal.project_tracker
    assign_to: team.content

  - step: schedule
    id: review_block
    from: calendar.find_slot
    params:
      duration: 45_minutes
      within_days: 3
      title: "Content Review: {{client.name}}"

  - step: notify
    id: confirm_sync
    to: "{{client.contact}}"
    subject: "Content requests received"
    body: |
      Received {{content_items.count}} new content requests.
      Assets due by {{earliest_due_date}}.
      Review scheduled for {{review_block.date}}.

output:
  type: workflow_complete
  approval: never

stakes: low
