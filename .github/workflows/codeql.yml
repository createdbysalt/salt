name: "CodeQL Security Scan"

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  schedule:
    # Run weekly scan on Mondays at 6 AM UTC
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      # Required for all workflows
      security-events: write
      # Required for workflows in private repositories
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # On PRs, keep the SARIF small so GitHub can process it reliably.
        # On main/scheduled scans, also run the quality queries.
        queries: ${{ github.event_name == 'pull_request' && 'security-extended' || 'security-extended,security-and-quality' }}
        config-file: ./.github/codeql/codeql-config.yml

    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
        # Upload SARIF to the Security tab. Requires CodeQL Default setup disabled
        # in GitHub repo settings (Settings → Code security → Code scanning).
        upload: true

