name: Staging Crons

# Vercel crons only fire on production deployments (main → usesalt.io).
# The staging branch deploys as a preview (app.staging.usesalt.io), so its
# cron endpoints never run — Gmail/Calendar/Drive/Stripe reconciliation,
# Cal.com polling, and daily trigger repair silently stop (capture-pipeline
# repair plan, Phase 3). This workflow curls the staging endpoints on the
# same schedules as vercel.json.
#
# capture-intelligence and signal-scan run on staging behind hard budget
# caps (CAPTURE_INTELLIGENCE_MAX_* env vars in the Vercel Preview
# environment cap workspaces + emails scanned per run — every scanned email
# is an LLM call). Schedules are deliberately sparser than production.
# Excluded as production-only: waitlist-nurture.
#
# Secret: STAGING_CRON_SECRET (same value as CRON_SECRET in the Vercel
# Preview environment; sourced from the 1Password `CRON_SECRET` item in
# the salt-software-development vault).
#
# KEEP IN SYNC with vercel.json crons — when adding/changing a cron there,
# decide whether staging needs it too. Full protocol + rotation runbook:
# docs/guides/deployment-environments.md § "Scheduled jobs (crons)".

permissions:
  contents: read

on:
  schedule:
    - cron: '30 */6 * * *' # capture-reconciliation (backfills + Cal.com polling)
    - cron: '0 3 * * *' # trigger-reconciliation (daily trigger repair) + purge-trash
    - cron: '0 4 * * *' # connector-catalog-sync (keeps connector_trigger_types fresh)
    - cron: '0 5 * * *' # watch-cleanup
    - cron: '15 * * * *' # capture-intelligence (hourly, budget-capped LLM scan)
    - cron: '45 */4 * * *' # signal-scan (heuristic sweep + playbook dispatch)
    - cron: '0 18 * * *' # email-digest (daily briefing; skips empty workspaces)
  workflow_dispatch:
    inputs:
      endpoint:
        description: 'Single cron endpoint to invoke (e.g. trigger-reconciliation), or "all"'
        required: false
        default: 'all'
        type: string

jobs:
  run-crons:
    runs-on: ubuntu-latest
    steps:
      - name: Call staging cron endpoints
        env:
          STAGING_URL: https://app.staging.usesalt.io
          CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_ENDPOINT: ${{ github.event.inputs.endpoint }}
        run: |
          set -u

          case "${SCHEDULE:-}" in
            "30 */6 * * *") endpoints="capture-reconciliation" ;;
            "0 3 * * *")    endpoints="trigger-reconciliation purge-trash" ;;
            "0 4 * * *")    endpoints="connector-catalog-sync" ;;
            "0 5 * * *")    endpoints="watch-cleanup" ;;
            "15 * * * *")   endpoints="capture-intelligence" ;;
            "45 */4 * * *") endpoints="signal-scan" ;;
            "0 18 * * *")   endpoints="email-digest" ;;
            "")
              # workflow_dispatch
              if [ -n "$DISPATCH_ENDPOINT" ] && [ "$DISPATCH_ENDPOINT" != "all" ]; then
                endpoints="$DISPATCH_ENDPOINT"
              else
                endpoints="capture-reconciliation trigger-reconciliation connector-catalog-sync purge-trash watch-cleanup capture-intelligence signal-scan email-digest"
              fi
              ;;
            *) echo "Unknown schedule: $SCHEDULE" && exit 1 ;;
          esac

          failed=0
          for endpoint in $endpoints; do
            echo "::group::/api/cron/$endpoint"
            status=$(curl -s -o response.json -w "%{http_code}" --max-time 300 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$STAGING_URL/api/cron/$endpoint")
            echo "HTTP $status"
            cat response.json || true
            echo
            echo "::endgroup::"
            {
              echo "### /api/cron/$endpoint — HTTP $status"
              echo '```json'
              cat response.json || true
              echo
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$status" != "200" ]; then
              echo "::error::/api/cron/$endpoint returned HTTP $status"
              failed=1
            fi
          done
          exit $failed
