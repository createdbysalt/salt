name: Security Review

permissions:
  pull-requests: write # Needed for leaving PR comments
  contents: read

on:
  pull_request:
    branches: [main, staging]

jobs:
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      # Dependabot PRs cannot read repository secrets (GitHub restriction), so the
      # Claude action fails immediately without ANTHROPIC_API_KEY. Skip cleanly so
      # required checks stay green; dependency bumps are low-risk for this scan.
      - name: Skip Dependabot PRs (no secret access)
        if: github.actor == 'dependabot[bot]' || startsWith(github.head_ref, 'dependabot/')
        run: |
          echo "Skipping AI security review — Dependabot PRs cannot access ANTHROPIC_API_KEY."
          echo "Re-run after merge to staging/main, or enable Dependabot secret access in repo settings."

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: github.actor != 'dependabot[bot]' && !startsWith(github.head_ref, 'dependabot/')
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - uses: anthropics/claude-code-security-review@main # no semver tag published; pin when release SHA available
        if: github.actor != 'dependabot[bot]' && !startsWith(github.head_ref, 'dependabot/')
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-model: claude-opus-4-1-20250805
          custom-security-scan-instructions: "" # Add any custom instructions specific to your codebase here.
